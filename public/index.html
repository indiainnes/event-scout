<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Scout</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #1a1d1f;
    --paper: #fbfaf7;
    --line: #e3ded4;
    --accent: #2f5d50;
    --accent-soft: #eef3f1;
    --muted: #6b6f70;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 32px clamp(20px, 5vw, 64px) 20px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin: 0; }
  main { padding: 28px clamp(20px, 5vw, 64px) 64px; max-width: 1100px; margin: 0 auto; }
  .status-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 28px;
  }
  .status-text { font-size: 0.9rem; color: var(--muted); }
  .status-text strong { color: var(--ink); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.secondary {
    background: white;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .new-events {
    border: 1px solid #d8c9a3;
    background: #fdf8ec;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 28px;
    display: none;
  }
  .new-events.visible { display: block; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
  }
  .section-head h2 { margin: 0; font-size: 1rem; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--ink); }
  th .arrow { font-size: 0.7rem; margin-left: 4px; opacity: 0.6; }
  section h2 { font-size: 1.05rem; margin: 0 0 12px; }
</style>
</head>
<body>
  <header>
    <h1>Event Scout</h1>
    <p class="subtitle">UK &amp; Europe events tracker — sports, festivals, holidays, and more</p>
  </header>

  <main>
    <div class="status-bar">
      <div class="status-text" id="statusText">Loading status…</div>
      <button id="refreshBtn">Check for new events now</button>
    </div>

    <div class="new-events" id="newEventsBox">
      <div class="section-head">
        <h2>New/changed events from the last check</h2>
        <button class="secondary" id="downloadNewBtn">Download as Excel</button>
      </div>
      <table id="newEventsTable">
        <thead>
          <tr>
            <th data-key="name">Event <span class="arrow"></span></th>
            <th data-key="dates">Date(s) <span class="arrow"></span></th>
            <th data-key="locations">Location <span class="arrow"></span></th>
            <th data-key="notes">Notes <span class="arrow"></span></th>
            <th data-key="source">Source <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <section>
      <div class="section-head">
        <h2>Currently tracked events (<span id="eventCount">0</span>)</h2>
        <button class="secondary" id="downloadAllBtn">Download as Excel</button>
      </div>
      <table id="eventsTable">
        <thead>
          <tr>
            <th data-key="name">Event <span class="arrow"></span></th>
            <th data-key="dates">Date(s) <span class="arrow"></span></th>
            <th data-key="locations">Location <span class="arrow"></span></th>
            <th data-key="notes">Notes <span class="arrow"></span></th>
            <th data-key="foundAt">Date added <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    const statusText = document.getElementById('statusText');
    const refreshBtn = document.getElementById('refreshBtn');
    const eventsTableBody = document.querySelector('#eventsTable tbody');
    const eventCount = document.getElementById('eventCount');
    const newEventsBox = document.getElementById('newEventsBox');
    const newEventsTableBody = document.querySelector('#newEventsTable tbody');

    let allEvents = [];
    let newEvents = [];
    const sortState = { events: { key: null, dir: 1 }, newEvents: { key: null, dir: 1 } };

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function formatDateAdded(value) {
      if (!value) return 'Original list';
